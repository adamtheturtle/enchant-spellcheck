---
name: Release

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Publish a release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: release
    env:
      UV_PYTHON: '3.13'
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # The release commit must pass the repository rules with an admin token.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Install Enchant and dictionaries
        run: brew install enchant

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Check release credentials
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: ': "${RELEASE_PAT:?Configure RELEASE_PAT as documented in docs/source/release-process.rst}"'

      - name: Validate release
        run: |
          uv run --group=dev pytest -vvv . --cov --cov-config=pyproject.toml
          uv run --group=dev prek run --all-files --hook-stage pre-commit
          uv run --group=dev prek run --all-files --hook-stage pre-push
          uv run --group=dev prek run --all-files --hook-stage manual

      - name: Calver calculate version
        id: calver
        run: |
          uv run python - <<'PYTHON'
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          today = datetime.now(tz=UTC).strftime("%Y.%m.%d")
          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          patches = []
          for tag in tags:
              if tag == today:
                  patches.append(0)
              elif tag.startswith(today + ".") and tag[len(today) + 1:].isdigit():
                  patches.append(int(tag[len(today) + 1:]))
          release = f"{today}.{max(patches) + 1}" if patches else today
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"release={release}\n")
          PYTHON

      - name: Assemble native Markdown release notes
        env:
          RELEASE: ${{ steps.calver.outputs.release }}
        run: |
          uv run --group=release towncrier build --yes --version "$RELEASE"
          uv run --group=dev snapper --native --max-width 0 --in-place "docs/source/changelog/$RELEASE.md"
          cp "docs/source/changelog/$RELEASE.md" release-notes.md

      - name: Commit notes and tag the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE: ${{ steps.calver.outputs.release }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/source/changelog newsfragments
          git commit -m "Release $RELEASE"
          gh auth setup-git
          git push origin HEAD:main
          git tag "$RELEASE"
          git push origin "$RELEASE"

      - name: Build a binary wheel and a source tarball
        run: |
          uv build --sdist --wheel --out-dir dist/
          uv run --group=release check-wheel-contents dist/*.whl

      - name: Publish distribution to PyPI
        run: uv publish --trusted-publishing always dist/*

      - name: Create a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ steps.calver.outputs.release }}
        run: gh release create "$RELEASE" dist/*.whl dist/*.tar.gz --verify-tag --title
          "Release $RELEASE" --notes-file release-notes.md
